server:
  port: 8800

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hbbxl-gateway
  codec:
    max-in-memory-size: 4096MB
  cloud:
    nacos:
      config:
        file-extension: yaml
    gateway:
      routes:
        - id: hbbxl-auth
          uri: lb://hbbxl-auth
          predicates:
            - Path=/api/auth/**,/api/crypto/**,/api/config/**
          filters:
            - StripPrefix=1
        - id: hbbxl-user
          uri: lb://hbbxl-user
          predicates:
            - Path=/api/user/**,/api/student/**,/api/role/**
          filters:
            - StripPrefix=1
        - id: hbbxl-college
          uri: lb://hbbxl-college
          predicates:
            - Path=/api/college/**,/api/major/**
          filters:
            - StripPrefix=1
        - id: hbbxl-score
          uri: lb://hbbxl-score
          predicates:
            - Path=/api/score/**
          filters:
            - StripPrefix=1
        - id: hbbxl-aspiration
          uri: lb://hbbxl-aspiration
          predicates:
            - Path=/api/aspiration/**
          filters:
            - StripPrefix=1
        - id: hbbxl-recommend
          uri: lb://hbbxl-recommend
          predicates:
            - Path=/api/recommend/**
          filters:
            - StripPrefix=1
        - id: api-crypto-envelope
          uri: http://placeholder
          predicates:
            - Path=/api/gw

api-crypto:
  key: "IH0zYCGnbvIp48FFuwa2siSBs5eDW6wyB58ZH/qNUXs="
