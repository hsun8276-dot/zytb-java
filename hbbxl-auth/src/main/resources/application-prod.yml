# 生产 = Mac Docker Desktop（与中间件同一 Docker 网络，用容器名互通；勿用 host.docker.internal）
# 容器名默认 mysql/redis/nacos/minio，不一致时用 compose/.env.mac 环境变量覆盖
spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        username: nacos
        password: nacos
        namespace: hbbxl
      config:
        server-addr: nacos:8848
        username: nacos
        password: nacos
        namespace: hbbxl
  datasource:
    url: jdbc:mysql://mysql:3306/zytb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: redis
      port: 6379
      password: ""
      database: 0
