services:
  hbbxl-gateway:
    image: ${REGISTRY_PREFIX}hbbxl/gateway:latest
    container_name: hbbxl-gateway
    network_mode: host
    restart: unless-stopped
    pull_policy: never
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - TZ=Asia/Shanghai
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8800/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
