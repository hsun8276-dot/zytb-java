# Mac Docker Desktop（M4）：bridge 网络 hbbxl-net，与已有 MySQL/Redis/Nacos/MinIO 用容器名互通。
# 不要用 host.docker.internal。
#
# 用法:
#   docker network create hbbxl-net 2>/dev/null || true
#   docker network connect hbbxl-net dz-mysql
#   docker network connect hbbxl-net dz-redis
#   docker network connect hbbxl-net dz-nacos
#   docker network connect hbbxl-net dz-minio
#   cp .env.mac.example .env.mac   # 按实际密码修改
#   docker compose -p hbbxl -f docker-compose.mac.yml --env-file .env.mac up -d

x-app-env: &app-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_ADDR:-dz-nacos:8848}
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_ADDR:-dz-nacos:8848}
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-nacos}
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:-nacos}
  SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:-nacos}
  SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:-nacos}
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-hbbxl}
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-hbbxl}
  SPRING_DATASOURCE_URL: ${MYSQL_JDBC:-jdbc:mysql://dz-mysql:3306/zytb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
  SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-dz-redis}
  SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://dz-minio:9000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-hbbxl}

services:
  hbbxl-gateway:
    image: ${REGISTRY_PREFIX:-}hbbxl/gateway:latest
    container_name: hbbxl-gateway
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8800:8800"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 512m

  hbbxl-auth:
    image: ${REGISTRY_PREFIX:-}hbbxl/auth:latest
    container_name: hbbxl-auth
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8801:8801"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 352m

  hbbxl-user:
    image: ${REGISTRY_PREFIX:-}hbbxl/user:latest
    container_name: hbbxl-user
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8802:8802"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 352m

  hbbxl-college:
    image: ${REGISTRY_PREFIX:-}hbbxl/college:latest
    container_name: hbbxl-college
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8803:8803"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 352m

  hbbxl-score:
    image: ${REGISTRY_PREFIX:-}hbbxl/score:latest
    container_name: hbbxl-score
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8804:8804"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 352m

  hbbxl-aspiration:
    image: ${REGISTRY_PREFIX:-}hbbxl/aspiration:latest
    container_name: hbbxl-aspiration
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8805:8805"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 512m

  hbbxl-recommend:
    image: ${REGISTRY_PREFIX:-}hbbxl/recommend:latest
    container_name: hbbxl-recommend
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8806:8806"
    environment:
      <<: *app-env
    networks: [hbbxl-net]
    mem_limit: 352m

  hbbxl-web:
    image: ${REGISTRY_PREFIX:-}hbbxl/web:latest
    container_name: hbbxl-web
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
      NGINX_PORT: "80"
      # 走 compose 内网服务名，不要用 127.0.0.1
      GATEWAY_UPSTREAM: hbbxl-gateway:8800
    depends_on:
      - hbbxl-gateway
    networks: [hbbxl-net]
    mem_limit: 128m

networks:
  hbbxl-net:
    name: hbbxl-net
    driver: bridge
